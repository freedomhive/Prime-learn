<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property manager | True Value Realty</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../assets/css/styles.css"></head><body class="admin-body"><header class="site-header"><a class="brand" href="../index.html"><img class="brand-logo" src="../assets/images/logo.png" alt="True Value Realty"><span class="brand-copy"><strong>TRUE <em>VALUE</em></strong><small>ADMIN</small></span></a><button id="logout-button" class="button button-outline">Sign out</button></header><main class="section admin-main" id="admin-root"><div class="admin-heading"><div><p class="eyebrow">PROPERTY MANAGEMENT</p><h1>Your <em>listings.</em></h1><p class="muted">Only publish information and photos you are authorised to use.</p></div><div id="admin-overview" class="admin-overview"></div></div><div class="admin-layout"><form id="property-form" class="lead-form admin-form"><input type="hidden" name="id"><h2 id="editor-title">Add a property</h2><label>Property title *<input name="title" required maxlength="140"></label><label>Slug<input name="slug" maxlength="160" placeholder="optional-url-slug"></label><div class="form-two"><label>Property type *<select name="property_type" required><option value="Residential Apartment">Apartment / flat</option><option value="Residential Plot">Plot / land</option><option value="Independent House">Villa / house</option><option value="Commercial Property">Commercial</option><option value="Agricultural Land">Agricultural land</option></select></label><label>Listing type *<select name="transaction_type"><option>Sale</option><option>Rent</option></select></label></div><div class="form-two"><label>Price (INR)<input name="price" type="number" min="0" step="1"></label><label>Price display<select name="price_display"><option value="exact">Exact price</option><option value="request">Price on request</option></select></label></div><div class="form-two"><label>Carpet area<input name="carpet_area" type="number" min="0" step="any"></label><label>Area unit<select name="area_unit"><option>sq. ft.</option><option>sq. m.</option><option>acre</option></select></label></div><div class="form-two"><label>Built-up area<input name="built_up_area" type="number" min="0" step="any"></label><label>Plot area<input name="plot_area" type="number" min="0" step="any"></label></div><div class="form-two"><label>Bedrooms<input name="bedrooms" type="number" min="0" max="50"></label><label>Bathrooms<input name="bathrooms" type="number" min="0" max="50"></label></div><label>Location / address *<input name="location" required maxlength="220"></label><div class="form-two"><label>Locality<input name="locality" maxlength="140"></label><label>PIN code<input name="pin_code" maxlength="12"></label></div><div class="form-two"><label>City<input name="city" value="Nashik"></label><label>State<input name="state" value="Maharashtra"></label></div><div class="form-two"><label>Parking<input name="parking"></label><label>Furnishing<select name="furnishing_status"><option value="">Not specified</option><option>Unfurnished</option><option>Semi-furnished</option><option>Fully furnished</option></select></label></div><label>Description<textarea name="description" rows="4" maxlength="4000"></textarea></label><label>Features / amenities<textarea name="features" rows="3" placeholder="Lift, Security, Garden"></textarea></label><label>Property photos<input id="images" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div id="image-preview" class="image-preview"></div><div class="form-two"><label>Publication status<select name="status"><option value="draft">Draft</option><option value="published">Published</option><option value="archived">Archived</option></select></label><label class="check-label"><input name="featured" type="checkbox"> Featured listing</label></div><label class="check-label"><input name="authorised" type="checkbox"> I confirm that the listing details and photos are accurate and authorised for publication.</label><div class="form-actions"><button class="button button-gold" type="submit">Save property</button><button id="reset-form-button" class="button button-outline" type="button">Clear</button></div><p id="admin-message" class="form-message" role="status"></p></form><section class="admin-list"><div class="list-header"><h2>Property catalogue</h2><button id="refresh-list" class="button button-outline" type="button">Refresh</button></div><div class="admin-list-filters"><input id="admin-search" placeholder="Search catalogue"><select id="admin-status"><option value="">All statuses</option><option value="draft">Draft</option><option value="published">Published</option><option value="archived">Archived</option></select></div><div id="admin-properties"><p class="muted">Loading catalogue...</p></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/supabase-client.js"></script><script src="../assets/js/admin.js"></script></body></html>
